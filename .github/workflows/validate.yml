name: Foundation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate foundation and host tests
        run: python scripts/validate.py
      - name: Parse PowerShell activation script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$pwd/scripts/activate-idf.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Validate Docker Compose configuration
        if: runner.os == 'Linux'
        run: docker compose -f infrastructure/compose.yaml config --quiet

